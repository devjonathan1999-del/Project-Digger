name: Godot 4.7.2 headless tests

on:
  push:
    branches:
      - feature/digger-v0.1
      - feature/progression-v0.3
      - feature/visual-v0.4
      - feature/visual-depth-v0.5
      - feature/final-graphics-v0.6
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          ./Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Import project
        shell: bash
        run: |
          set +e
          timeout 90s ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --quit --path . 2>&1 | tee godot-import.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then
            exit "$status"
          fi
          if grep -Eq '(^|[[:space:]])(SCRIPT ERROR|ERROR):' godot-import.log; then
            exit 1
          fi

      - name: Run headless test suite
        shell: bash
        run: |
          set +e
          timeout 90s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/test_runner.gd 2>&1 | tee godot-tests.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then
            exit "$status"
          fi
          if grep -Eq '(^|[[:space:]])(SCRIPT ERROR|ERROR):' godot-tests.log; then
            exit 1
          fi

      - name: Exercise industry UI and capture layouts
        shell: bash
        run: |
          set +e
          timeout 90s xvfb-run -a ./Godot_v4.7.2-stable_linux.x86_64 --path . --audio-driver Dummy --rendering-method gl_compatibility -s res://tests/test_industry_ui.gd -- --screenshots /tmp/digger-ui 2>&1 | tee godot-ui.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then
            exit "$status"
          fi
          if grep -Eq '(^|[[:space:]])(SCRIPT ERROR|ERROR):' godot-ui.log; then
            exit 1
          fi

      - name: Exercise progression context actions
