name: Godot 4.7.2 headless tests

on:
  push:
    branches:
      - feature/digger-v0.2
      - main
  workflow_dispatch:

concurrency:
  group: godot-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          ./Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Initialize clean Godot project cache
        shell: bash
        run: |
          set +e
          OUTPUT=$(timeout 60s ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit 2>&1)
          STATUS=$?
          set -e
          printf '%s\n' "$OUTPUT"
          if [ "$STATUS" -eq 124 ]; then
            echo '::error::Godot project initialization timed out'
            exit 1
          fi
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script' <<< "$OUTPUT"; then
            echo '::error::Godot script or parse error detected during clean project initialization'
            exit 1
          fi
          exit "$STATUS"

      - name: Run headless test suite
        shell: bash
        run: |
          set +e
          OUTPUT=$(timeout 60s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/test_runner.gd 2>&1)
          STATUS=$?
          set -e
          printf '%s\n' "$OUTPUT"
          if [ "$STATUS" -eq 124 ]; then
            echo '::error::Godot test suite timed out'
            exit 1
          fi
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script' <<< "$OUTPUT"; then
            echo '::error::Godot script or parse error detected'
            exit 1
          fi
          exit "$STATUS"
