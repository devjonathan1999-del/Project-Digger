name: Asset-driven v0.7 tests

on:
  push:
    branches:
      - feature/asset-driven-v0.7
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  v07:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          ./Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Import project
        shell: bash
        run: |
          set +e
          timeout 90s ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --quit --path . 2>&1 | tee godot-import-v07.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then exit "$status"; fi
          if grep -Eq '(^|[[:space:]])(SCRIPT ERROR|ERROR):' godot-import-v07.log; then exit 1; fi

      - name: Verify v0.7 payload bytes
        shell: bash
        run: |
          cat assets/industry/v07/payload/part*.b64 | tr -d '\r\n ' > /tmp/v07-atlas.b64
          test "$(wc -c < /tmp/v07-atlas.b64)" -eq 32008
          base64 -d /tmp/v07-atlas.b64 > /tmp/v07-atlas.png
          test "$(wc -c < /tmp/v07-atlas.png)" -eq 24006
          echo "b097eacc7bd7014e6a142b36e2e6554a351e96312feac793c5ed2265707a5925  /tmp/v07-atlas.png" | sha256sum -c -
          file /tmp/v07-atlas.png | grep -F "PNG image data, 512 x 384"

      - name: Exercise asset-driven v0.7 assets
        shell: bash
        run: |
          set +e
          timeout 90s xvfb-run -a ./Godot_v4.7.2-stable_linux.x86_64 --path . --audio-driver Dummy --rendering-method gl_compatibility -s res://tests/test_visual_v07_assets.gd 2>&1 | tee godot-v07-assets.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then exit "$status"; fi
          if grep -Eq '(^|[[:space:]])(SCRIPT ERROR|ERROR):' godot-v07-assets.log; then exit 1; fi

      - name: Exercise runtime-compatible v0.7 renderer
        shell: bash
        run: |
          set +e
          timeout 90s xvfb-run -a ./Godot_v4.7.2-stable_linux.x86_64 --path . --audio-driver Dummy --rendering-method gl_compatibility -s res://tests/test_visual_v07_renderer.gd 2>&1 | tee godot-v07-renderer.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then exit "$status"; fi
          if grep -Eq '(^|[[:space:]])(SCRIPT ERROR|ERROR):' godot-v07-renderer.log; then exit 1; fi

      - name: Exercise illustrated v0.7 resources
        shell: bash
        run: |
          set +e
          timeout 90s xvfb-run -a ./Godot_v4.7.2-stable_linux.x86_64 --path . --audio-driver Dummy --rendering-method gl_compatibility -s res://tests/test_visual_v07_resources.gd 2>&1 | tee godot-v07-resources.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then exit "$status"; fi
          if grep -Eq '(^|[[:space:]])(SCRIPT ERROR|ERROR):' godot-v07-resources.log; then exit 1; fi

      - name: Exercise v0.7 interaction ownership
        shell: bash
        run: |
          set +e
          timeout 90s xvfb-run -a ./Godot_v4.7.2-stable_linux.x86_64 --path . --audio-driver Dummy --rendering-method gl_compatibility -s res://tests/test_visual_v07_interactions.gd 2>&1 | tee godot-v07-interactions.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then exit "$status"; fi
          if grep -Eq '(^|[[:space:]])(SCRIPT ERROR|ERROR):' godot-v07-interactions.log; then exit 1; fi

      - name: Capture asset-driven v0.7 showcase
        shell: bash
        run: |
          set +e
          timeout 90s xvfb-run -a ./Godot_v4.7.2-stable_linux.x86_64 --path . --audio-driver Dummy --rendering-method gl_compatibility -s res://tests/test_visual_v07_captures.gd -- --screenshots /tmp/digger-v07 2>&1 | tee godot-v07-captures.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then exit "$status"; fi
          if grep -Eq '(^|[[:space:]])(SCRIPT ERROR|ERROR):' godot-v07-captures.log; then exit 1; fi

      - name: Upload v0.7 screenshots
        uses: actions/upload-artifact@v7.0.1
        with:
          name: digger-v07-captures
          path: /tmp/digger-v07
          if-no-files-found: error
